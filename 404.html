<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page Not Found | BuildPro</title>
  <meta name="description" content="The requested BuildPro page could not be found.">

  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f7;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #111827;
      padding: 18px 50px;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 28px;
      font-weight: bold;
    }

    .logo span {
      color: #f59e0b;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 50px 20px;
    }

    .box {
      max-width: 650px;
    }

    .number {
      font-size: 110px;
      font-weight: bold;
      color: #111827;
      line-height: 1;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 38px;
      color: #111827;
      margin-bottom: 15px;
    }

    p {
      color: #666;
      font-size: 17px;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      background: #f59e0b;
      color: #111827;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 6px;
      font-weight: bold;
    }

    .btn:hover {
      opacity: .9;
    }

    footer {
      background: #0b1120;
      color: #d1d5db;
      text-align: center;
      padding: 25px 20px;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header {
        padding: 16px 20px;
      }

      .number {
        font-size: 80px;
      }

      h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

<header>
  <a href="index.html" class="logo">Build<span>Pro</span></a>
</header>

<main>
  <div class="box">

    <div class="number">404</div>

    <h1>Page Not Found</h1>

    <p>
      Sorry, the page you are looking for does not exist or may have been
      moved. You can return to the BuildPro homepage.
    </p>

    <a href="index.html" class="btn">Back to Home</a>

  </div>
</main>

<footer>
  BuildPro — Construction & Project Solutions
</footer>

</body>
</html>
